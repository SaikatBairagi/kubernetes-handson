apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminer-deployment
spec:
  selector:
    matchLabels:
      app: pgadminer
  template:
    metadata:
      labels:
        app: pgadminer
    spec:
      containers:
      - name: pgadminer-container
        image: adminer:latest
        ports:
        - containerPort: 8080
        env:
        - name: ADMINER_DEFAULT_SERVER
          valueFrom:
            configMapKeyRef:
              key: PG_SERVICE
              name: pgadminer-cm
---
apiVersion: v1
kind: Service
metadata:
  name: adminer-service
spec:
  selector:
    app: pgadminer
  ports:
  - port: 8080
    targetPort: 8080

